# Render Blueprint — one-click deploy of the Haulage finance app.
# In the Render dashboard: New → Blueprint → connect this repo. Render detects
# this file and provisions the service. The app redeploys automatically on every
# push to the connected branch (real-time updates).
services:
  - type: web
    name: haulage-finance
    runtime: node
    plan: starter # persistent disk requires a paid plan
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /haulage/
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Optional: enable cloud OCR. Set the value in the Render dashboard.
      - key: OPENAI_API_KEY
        sync: false
      # Primary mod (sole admin) account — password set in Render dashboard / API
      # (defaults to Haulage_Admin when username is Haulage_Admin).
      - key: HAULAGE_ADMIN_USERNAME
        value: Haulage_Admin
      - key: HAULAGE_ADMIN_PASSWORD
        sync: false
      # Optional outbound email (recovery links + 90-day password reminders).
      # Without these, recovery still works in-browser via a same-origin link.
      - key: APP_BASE_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
    # Persist accounts + receipts across deploys (required for multi-user admin).
    disk:
      name: haulage-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
