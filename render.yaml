# Render Blueprint — one-click deploy of the Haulage finance app.
# In the Render dashboard: New → Blueprint → connect this repo. Render detects
# this file and provisions the service. The app redeploys automatically on every
# push to the connected branch (real-time updates).
services:
  - type: web
    name: haulage-finance
    runtime: node
    plan: starter # persistent disk requires a paid plan
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /haulage/
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Optional: enable cloud OCR. Set the value in the Render dashboard.
      - key: OPENAI_API_KEY
        sync: false
      # Primary mod (sole admin) account — password set in Render dashboard / API
      # (defaults to Haulage_Admin when username is Haulage_Admin).
      - key: HAULAGE_ADMIN_USERNAME
        value: Haulage_Admin
      - key: HAULAGE_ADMIN_PASSWORD
        sync: false
      # Outbound email — required for Support contact + recovery emails to leave
      # the server. Prefer Gmail SMTP (app password) OR Resend API key.
      # Without either, the Support tab falls back to browser FormSubmit delivery.
      - key: APP_BASE_URL
        sync: false
      # Cross-origin allowlist for Play / iOS WebViews (comma-separated origins).
      # Leave unset for same-origin web. Example:
      # capacitor://localhost,https://your-custom-domain.com
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ALLOW_CAPACITOR
        sync: false
      - key: SUPPORT_EMAIL
        value: support@godriverhub.com
      - key: MAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      # Full-store backups at 5pm Sydney (data/backups/). Optional off-site:
      # BACKUP_OFFSITE_DIR and/or BACKUP_S3_BUCKET + AWS credentials.
      # Security: guest shared store off by default; set ALLOW_GUEST_STORE=1 only for local demos.
      - key: ALLOW_GUEST_STORE
        value: "0"
      - key: AUTH_LOCKOUT_MS
        value: "1800000"
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "30"
      - key: RATE_LIMIT_LOGIN_MAX
        value: "20"
      - key: BACKUP_ENABLED
        value: "1"
      - key: BACKUP_AT
        value: "17:00"
      - key: BACKUP_TIMEZONE
        value: Australia/Sydney
      - key: BACKUP_KEEP
        value: "5"
      - key: BACKUP_MIN_KEEP
        value: "2"
      - key: BACKUP_NOTIFY_EMAIL
        sync: false
      - key: BACKUP_OFFSITE_DIR
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_PREFIX
        value: haulage-backups
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: ap-southeast-2
      # Stripe — Taxation Hub Pro ($5/mo AUD). Create a Price in Stripe Dashboard
      # and set STRIPE_PRICE_ID. Webhook endpoint: /api/haulage/billing/webhook
      # (events: checkout.session.completed, customer.subscription.*).
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
    # Persist accounts + receipts across deploys (required for multi-user admin).
    disk:
      name: haulage-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
