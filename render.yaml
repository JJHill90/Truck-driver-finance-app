# Render Blueprint — two web services from this repo:
#   haulage-finance     Driver Hub / Taxation Hub / Fuel Hub  →  /haulage/
#   go-taxation-suite   Go Taxation Suite (general ATO)       →  /suite/
# In the Render dashboard: New → Blueprint → connect this repo. Render detects
# this file and provisions both services (each with its own persistent disk).
# If haulage-finance already exists, open Blueprints → this repo → Manual Sync
# to create the second service without replacing the first.
# Both redeploy automatically on every push to the connected branch (use main).
services:
  - type: web
    name: haulage-finance
    runtime: node
    plan: starter # persistent disk requires a paid plan
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /haulage/
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Driver Hub host. Do not set this to suite on the truck-driver service.
      - key: APP_PRODUCT
        value: haulage
      # Persistent disk. Native Node and Docker both write here (not /app/data).
      - key: DATA_DIR
        value: /opt/render/project/src/data
      # Absolute origin of the Go Taxation Suite Render service
      # (e.g. https://your-suite-service.example.com). When set, /suite on this
      # host redirects there so the products are visibly separate.
      - key: SUITE_PUBLIC_URL
        sync: false
      # Optional: enable cloud OCR. Set the value in the Render dashboard.
      - key: OPENAI_API_KEY
        sync: false
      # Primary mod (sole admin) account — username and password are set in
      # the Render dashboard (not stored in this Blueprint).
      - key: HAULAGE_ADMIN_USERNAME # pragma: allowlist secret
        sync: false
      - key: HAULAGE_ADMIN_PASSWORD # pragma: allowlist secret
        sync: false
      # Outbound email — required for Support contact + recovery emails to leave
      # the server. Prefer Gmail SMTP (app password) OR Resend API key.
      # Without either, Support still saves the request and emails via FormSubmit
      # from the server (activation stays in the developer inbox, not the UI).
      - key: APP_BASE_URL
        sync: false
      # Cross-origin allowlist for Play / iOS WebViews (comma-separated origins).
      # Leave unset for same-origin web. Example:
      # capacitor://localhost,https://your-custom-domain.com
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ALLOW_CAPACITOR
        sync: false
      - key: SUPPORT_EMAIL
        value: support@godriverhub.com
      - key: MAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      # Full-store backups at 5pm Sydney (data/backups/). Optional off-site:
      # BACKUP_OFFSITE_DIR and/or BACKUP_S3_BUCKET + AWS credentials.
      # Security: guest shared store off by default; set ALLOW_GUEST_STORE=1 only for local demos.
      - key: ALLOW_GUEST_STORE
        value: "0"
      - key: AUTH_LOCKOUT_MS
        value: "1800000"
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "30"
      - key: RATE_LIMIT_LOGIN_MAX
        value: "20"
      - key: BACKUP_ENABLED
        value: "1"
      - key: BACKUP_AUTORESTORE
        value: "1"
      - key: BACKUP_AT
        value: "17:00"
      - key: BACKUP_TIMEZONE
        value: Australia/Sydney
      - key: BACKUP_KEEP
        value: "5"
      - key: BACKUP_MIN_KEEP
        value: "2"
      - key: BACKUP_NOTIFY_EMAIL
        sync: false
      - key: BACKUP_OFFSITE_DIR
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_PREFIX
        value: haulage-backups
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: ap-southeast-2
      # Stripe — Taxation Hub Pro ($5/mo AUD). Create a Price in Stripe Dashboard
      # and set STRIPE_PRICE_ID. Webhook endpoint: /api/haulage/billing/webhook
      # (events: checkout.session.completed, customer.subscription.*).
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
    # Persist accounts + receipts across deploys (required for multi-user admin).
    disk:
      name: haulage-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1

  # Second Render service — Go Taxation Suite on its own URL and disk.
  # Root `/` and `/haulage` redirect to `/suite/`. Accounts are NOT shared with
  # haulage-finance (separate persistent disk). Same GitHub repo / branch.
  - type: web
    name: go-taxation-suite
    runtime: node
    plan: starter # persistent disk requires a paid plan
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /suite/
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: APP_PRODUCT
        value: suite
      # Persistent disk. Native Node and Docker both write here (not /app/data).
      - key: DATA_DIR
        value: /opt/render/project/src/data
      # Absolute origin of the Driver Hub Render service
      # (e.g. https://your-service.example.com). When set, /haulage on this
      # host redirects there so Suite is never mistaken for Driver Hub.
      - key: DRIVERHUB_PUBLIC_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Primary mod password is set in the Render dashboard (same bootstrap as Driver Hub).
      - key: HAULAGE_ADMIN_USERNAME # pragma: allowlist secret
        sync: false
      - key: HAULAGE_ADMIN_PASSWORD # pragma: allowlist secret
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ALLOW_CAPACITOR
        sync: false
      - key: SUPPORT_EMAIL
        value: support@godriverhub.com
      - key: MAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: ALLOW_GUEST_STORE
        value: "0"
      - key: AUTH_LOCKOUT_MS
        value: "1800000"
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "30"
      - key: RATE_LIMIT_LOGIN_MAX
        value: "20"
      - key: BACKUP_ENABLED
        value: "1"
      - key: BACKUP_AUTORESTORE
        value: "1"
      - key: BACKUP_AT
        value: "17:00"
      - key: BACKUP_TIMEZONE
        value: Australia/Sydney
      - key: BACKUP_KEEP
        value: "5"
      - key: BACKUP_MIN_KEEP
        value: "2"
      - key: BACKUP_NOTIFY_EMAIL
        sync: false
      - key: BACKUP_OFFSITE_DIR
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_PREFIX
        value: gotax-backups
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: ap-southeast-2
      # Stripe — Go Taxation Suite Pro ($10/mo or $110/yr AUD). Separate Prices
      # from Driver Hub. Do not reuse STRIPE_PRICE_ID ($5/$60) on this service.
      # Webhook endpoint: /api/haulage/billing/webhook
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID_SUITE
        sync: false
      - key: STRIPE_PRICE_ID_SUITE_YEARLY
        sync: false
    disk:
      name: gotax-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
