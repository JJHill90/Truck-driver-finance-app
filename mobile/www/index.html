<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Driver Hub</title>
    <style>
      :root {
        color-scheme: dark;
        --navy: #0b1f33;
        --amber: #f0a202;
        --ink: #e8eef5;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(120% 80% at 20% 0%, #16324f 0%, var(--navy) 55%);
        color: var(--ink);
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 2rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--amber);
      }
      p {
        margin: 0;
        max-width: 22rem;
        line-height: 1.45;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Driver Hub</h1>
      <p>
        Connecting to your account… If this screen stays up, check your
        network or confirm the app server URL in
        <code>capacitor.config.json</code>.
      </p>
    </div>
  </body>
</html>
